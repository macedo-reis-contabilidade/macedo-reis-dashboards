<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarefas · Comercial — Macedo & Reis</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/auth-guard.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo"><img src="assets/logo-mr.png" alt="Macedo & Reis" width="32" height="32" style="display:block;object-fit:contain;"></div>
        <div class="topbar-name">Macedo <span>&</span> Reis</div>
      </div>
      <div class="topbar-actions">
        <div class="user-chip"><div class="user-avatar" id="userAvatar">—</div><span id="userName">Carregando…</span></div>
        <button class="btn btn-ghost btn-sm" id="btnLogout">Sair</button>
      </div>
    </header>

    <main class="content">
      <div class="page-header">
        <div class="breadcrumb">
          <a href="index.html">Painel central</a>
          <span class="breadcrumb-sep">/</span>
          <a href="comercial.html">Comercial</a>
          <span class="breadcrumb-sep">/</span>
          <span>Tarefas</span>
        </div>
        <div class="eyebrow">Controle de tarefas</div>
        <h1>Tarefas</h1>
        <p>Tarefas do setor agrupadas por tipo. As rotinas do dia aparecem no topo; use a faixa de foco para ver o que vence e abra cada grupo para trabalhar em lote.</p>
      </div>

      <div id="tarefasApp"></div>
    </main>
  </div>

  <script type="module">
    import { initTarefas } from './assets/js/tarefas-engine.js';
    initTarefas({
      setor: 'comercial',
      gerarMes: true,
      recorrentes: true,
      tituloPlaceholder: 'Ex.: Retornar proposta ao cliente',
      andamentoPlaceholder: 'Ex.: Proposta enviada; aguardando retorno do cliente…',
      emptyDica: 'Crie uma tarefa avulsa ou gere as recorrentes do mês.'
    });
  </script>
</body>
</html>
