<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarefas · Societário — Macedo & Reis</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/auth-guard.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo"><img src="assets/logo-mr.png" alt="Macedo & Reis" width="32" height="32" style="display:block;object-fit:contain;"></div>
        <div class="topbar-name">Macedo <span>&</span> Reis</div>
      </div>
      <div class="topbar-actions">
        <div class="user-chip"><div class="user-avatar" id="userAvatar">—</div><span id="userName">Carregando…</span></div>
        <button class="btn btn-ghost btn-sm" id="btnLogout">Sair</button>
      </div>
    </header>

    <main class="content">
      <div class="page-header">
        <div class="breadcrumb">
          <a href="index.html">Painel central</a>
          <span class="breadcrumb-sep">/</span>
          <a href="societario.html">Societário</a>
          <span class="breadcrumb-sep">/</span>
          <span>Tarefas</span>
        </div>
        <div class="eyebrow">Controle de tarefas</div>
        <h1>Tarefas</h1>
        <p>Processos societários agrupados por tipo. As rotinas do dia aparecem no topo; abra um processo para ver os dados e registrar os andamentos na linha do tempo.</p>
      </div>

      <div id="tarefasApp"></div>
    </main>
  </div>

  <script type="module">
    import { initTarefas } from './assets/js/tarefas-engine.js';
    initTarefas({
      setor: 'societario',
      item: 'processo',
      itemPluralFem: false,
      btnNova: 'Novo processo',
      buscaPlaceholder: 'Buscar por processo ou empresa…',
      clienteLabel: 'Empresa',
      semClienteOption: '— Sem empresa (interno) —',
      semClienteDetalhe: 'Interno (sem empresa)',
      tituloLabel: 'Tipo de processo *',
      tituloPlaceholder: 'Ex.: Alteração contratual, Transformação, Baixa…',
      tituloAviso: 'Informe o tipo de processo.',
      andamentoPlaceholder: 'Ex.: Protocolado na Junta, saiu o deferimento…',
      historicoCadastro: 'Processo cadastrado.',
      historicoConcluida: 'Processo concluído.',
      historicoReaberta: 'Processo reaberto.',
      confirmConcluir: 'Concluir este processo?',
      confirmExcluir: 'Excluir este processo e toda a sua linha do tempo? Esta ação não pode ser desfeita.',
      emptyTitulo: 'Nenhum processo ainda',
      emptyDica: 'Crie um processo no botão Novo processo.'
    });
  </script>
</body>
</html>
