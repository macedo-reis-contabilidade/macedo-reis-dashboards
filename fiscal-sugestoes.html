<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiscal — Sugestões de melhoria — Macedo & Reis</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/auth-guard.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo"><img src="assets/logo-mr.png" alt="Macedo & Reis" width="32" height="32" style="display:block;object-fit:contain;"></div>
        <div class="topbar-name">Macedo <span>&</span> Reis</div>
      </div>
      <div class="topbar-actions">
        <div class="user-chip"><div class="user-avatar" id="userAvatar">—</div><span id="userName">Carregando…</span></div>
        <button class="btn btn-ghost btn-sm" id="btnLogout">Sair</button>
      </div>
    </header>

    <!-- conteúdo montado pelo módulo único de sugestões por setor (assets/js/sugestoes-setor.js) -->
    <main class="content" id="sgRaiz"></main>
  </div>

  <script type="module">
    import { initSugestoesSetor } from './assets/js/sugestoes-setor.js';
    initSugestoesSetor({
      setor: 'fiscal',
      nomeSetor: 'Fiscal',
      hub: 'fiscal.html'
    });
  </script>
</body>
</html>
