<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Macedo & Reis Dashboards</title>
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- tema claro/escuro escolhido no sistema: o login não usa o auth-guard, então carrega direto.
       Sem barra do topo não há o botão ☀️/🌙 — só a cor combina com o resto. -->
  <script type="module" src="assets/js/theme.js"></script>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-logo">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M28 4 C30 14, 42 24, 52 28 C42 32, 30 42, 28 52 C26 42, 14 32, 4 28 C14 24, 26 14, 28 4 Z" fill="url(#petalGrad)"/>
            <defs>
              <linearGradient id="petalGrad" x1="4" y1="4" x2="52" y2="52" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#8AAEC8"/>
                <stop offset="0.5" stop-color="#5B82A6"/>
                <stop offset="1" stop-color="#3A5878"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1>Macedo <span>&</span> Reis</h1>
        <p id="loginSub">Dashboards internos</p>
      </div>

      <div id="formError" class="form-error" role="alert"></div>

      <div id="blocoEntrar">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" class="input" autocomplete="current-password" required>
        </div>

        <button type="button" id="btnLogin" class="btn btn-primary">Entrar</button>
      </div>

      <!-- a senha nova (21/10/2026): obrigatória no primeiro acesso, com a senha provisória; ou quando a pessoa pede,
           clicando no próprio nome no alto da tela (login.html?trocar=1). As regras ficam em assets/js/senha.js -->
      <div id="blocoSenha" hidden>
        <p id="senhaTexto" style="margin:0 0 20px;font-size:0.9rem;line-height:1.55;color:var(--text-2);"></p>
        <div class="form-group" id="grupoAtual">
          <label for="senhaAtual" id="rotuloAtual">Senha atual</label>
          <input type="password" id="senhaAtual" class="input" autocomplete="current-password">
        </div>
        <div class="form-group">
          <label for="senhaNova">Senha nova</label>
          <input type="password" id="senhaNova" class="input" autocomplete="new-password" aria-describedby="senhaRegra">
          <small id="senhaRegra" style="display:block;margin-top:6px;font-size:0.78rem;line-height:1.45;color:var(--text-muted);">Pelo menos 8 caracteres. Uma frase curta é fácil de lembrar e difícil de adivinhar.</small>
        </div>
        <div class="form-group">
          <label for="senhaRepete">Repita a senha nova</label>
          <input type="password" id="senhaRepete" class="input" autocomplete="new-password">
        </div>
        <button type="button" id="btnSenha" class="btn btn-primary">Salvar a senha nova</button>
        <button type="button" id="btnSenhaVoltar" class="btn btn-ghost">Voltar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './assets/js/supabase.js';
    import { precisaTrocar, problemaDaSenha, erroDoLogin, erroDaTroca } from './assets/js/senha.js';

    const $ = id => document.getElementById(id);
    const emailInput = $('email');
    const passwordInput = $('password');
    const btnLogin = $('btnLogin');
    const formError = $('formError');
    const params = new URLSearchParams(window.location.search);
    // a senha com que a pessoa acabou de entrar (só na memória desta página): na troca logo depois, não pede de novo
    let senhaDoLogin = null;
    let modoSenha = null;     // 'primeiro' (senha provisória: trocar é obrigatório) | 'trocar' (a pessoa pediu)
    let emailDaConta = '';
    // a tela que perdeu o login com ela aberta volta pra cá com ?saiu=1 (assets/js/auth-guard.js): o porquê, no lugar do subtítulo
    if (params.get('saiu') === '1') $('loginSub').textContent = 'A sessão terminou. Entre de novo.';

    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;
      if (precisaTrocar(session.user)) mostrarSenha('primeiro', session.user);
      else if (params.get('trocar') === '1') mostrarSenha('trocar', session.user);
      else window.location.href = destinoSeguro(params.get('redirect'));
    })();

    function showError(msg) {
      formError.textContent = msg;
      formError.classList.add('is-visible');
    }

    function clearError() {
      formError.classList.remove('is-visible');
      formError.textContent = '';
    }

    async function doLogin() {
      clearError();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Preencha email e senha.');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Entrando...';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        showError(erroDoLogin(error));
        btnLogin.disabled = false;
        btnLogin.textContent = 'Entrar';
        return;
      }

      senhaDoLogin = password;
      const user = data && data.user;
      if (precisaTrocar(user)) return mostrarSenha('primeiro', user);
      if (params.get('trocar') === '1') return mostrarSenha('trocar', user);
      window.location.href = destinoSeguro(params.get('redirect'));
    }

    // a volta depois do login: só pra uma tela do próprio sistema — um link com ?redirect= pra outro site,
    // ou com javascript:, rodaria código (ou abriria uma página falsa) logo depois de a pessoa entrar
    function destinoSeguro(r) {
      if (!r) return 'index.html';
      try {
        const u = new URL(r, window.location.href);
        return u.origin === window.location.origin ? u.pathname + u.search + u.hash : 'index.html';
      } catch (e) { return 'index.html'; }
    }

    // ---------- a senha nova ----------
    function mostrarSenha(modo, user) {
      modoSenha = modo;
      emailDaConta = String((user && user.email) || emailInput.value.trim() || '').toLowerCase();
      emailInput.value = emailDaConta;   // o gerenciador de senhas do navegador guarda a nova com o e-mail certo
      clearError();
      $('blocoEntrar').hidden = true;
      $('blocoSenha').hidden = false;
      const primeiro = modo === 'primeiro';
      $('loginSub').textContent = primeiro ? 'Crie a sua senha' : 'Trocar a senha';
      $('senhaTexto').textContent = primeiro
        ? 'Você entrou com uma senha provisória. Antes de começar, crie uma senha só sua para ' + emailDaConta + '.'
        : 'A senha nova vale pra ' + emailDaConta + ' a partir de agora, em qualquer computador.';
      // a senha atual: pedida, salvo logo depois de entrar com ela
      $('grupoAtual').hidden = !!senhaDoLogin;
      $('rotuloAtual').textContent = primeiro ? 'Senha provisória (a que você recebeu)' : 'Senha atual';
      $('btnSenhaVoltar').textContent = primeiro ? 'Sair' : 'Voltar';
      (senhaDoLogin ? $('senhaNova') : $('senhaAtual')).focus();
    }

    async function salvarSenha() {
      clearError();
      const atual = senhaDoLogin || $('senhaAtual').value;
      const nova = $('senhaNova').value;
      const problema = problemaDaSenha({ atual, nova, repete: $('senhaRepete').value, provisoria: modoSenha === 'primeiro' });
      if (problema) { showError(problema); return; }
      const b = $('btnSenha');
      b.disabled = true; b.textContent = 'Salvando...';
      const destravar = () => { b.disabled = false; b.textContent = 'Salvar a senha nova'; };
      // confere a senha atual entrando de novo com ela — e a sessão fica recente, que o Supabase pode exigir pra trocar
      if (!senhaDoLogin) {
        const { error } = await supabase.auth.signInWithPassword({ email: emailDaConta, password: atual });
        if (error) {
          showError(modoSenha === 'primeiro' ? 'A senha provisória não confere.' : 'A senha atual não confere.');
          destravar();
          return;
        }
        senhaDoLogin = atual;
      }
      const { error } = await supabase.auth.updateUser({ password: nova, data: { trocar_senha: null } });
      if (error) { showError(erroDaTroca(error)); destravar(); return; }
      senhaDoLogin = null;
      b.textContent = 'Senha trocada';
      window.location.href = destinoSeguro(params.get('redirect'));
    }

    $('btnSenhaVoltar').addEventListener('click', async () => {
      if (modoSenha !== 'primeiro') { window.location.href = destinoSeguro(params.get('redirect')); return; }
      // no primeiro acesso não dá pra pular: "Sair" encerra a sessão (só neste navegador) e volta pro entrar
      await supabase.auth.signOut({ scope: 'local' });
      senhaDoLogin = null; modoSenha = null;
      passwordInput.value = '';
      ['senhaAtual', 'senhaNova', 'senhaRepete'].forEach(id => { $(id).value = ''; });
      clearError();
      $('blocoSenha').hidden = true;
      $('blocoEntrar').hidden = false;
      $('loginSub').textContent = 'Dashboards internos';
      passwordInput.focus();
    });

    btnLogin.addEventListener('click', doLogin);
    $('btnSenha').addEventListener('click', salvarSenha);

    [emailInput, passwordInput].forEach(input => {
      input.addEventListener('keypress', e => {
        if (e.key === 'Enter') doLogin();
      });
    });
    ['senhaAtual', 'senhaNova', 'senhaRepete'].forEach(id => {
      $(id).addEventListener('keypress', e => { if (e.key === 'Enter') salvarSenha(); });
    });
  </script>
</body>
</html>
