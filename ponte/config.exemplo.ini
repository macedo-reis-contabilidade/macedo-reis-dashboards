; Modelo da configuração da Ponte do Domínio.
; A de verdade fica em C:\ponte-dominio\config.ini — FORA do repositório, legível só pelo usuário do PC.
; Nunca ponha senha, chave ou endereço de verdade neste arquivo: ele é público.

[dominio]
; A string ODBC da cópia do banco, no formato do usuário externo da Domínio: autenticação do banco
; e o servidor pelo nome. Quando o servidor estiver em outra máquina, acrescente Host=endereço:porta.
; Ou, se for criada uma fonte de dados no Windows (ODBC 64 bits, igual ao Python), só: DSN=nome
conexao = DRIVER={SQL Anywhere 17};UID=EXTERNO;PWD=senha;ServerName=srvcontabil

[sistema]
; O endereço da função do sistema que recebe os totais.
url = https://exemplo.supabase.co/functions/v1/ponte-dominio
; A chave anônima do Supabase (é pública, a mesma das telas).
chave_publica = chave-anonima-de-exemplo
; O segredo da ponte (o sistema confere no cabeçalho x-chave).
chave_ponte = segredo-de-exemplo

[rodada]
; Quantos meses cada rodada manda, contando o atual (1 a 24; 24 só na carga inicial).
meses = 3
