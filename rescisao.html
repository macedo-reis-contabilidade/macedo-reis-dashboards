<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Rescisão de funcionário — Macedo & Reis Contabilidade</title>
<link rel="icon" href="assets/favicon.ico">
<!-- Link público do módulo Rescisões (DP), o mesmo pra todas as empresas — na lógica das admissões (admissao.html):
     a empresa se identifica, responde e envia; a rescisão nasce no módulo (dp-rescisoes.html) e na agenda do DP.
     As perguntas são fixas (uma depende da outra) e as datas — início do aviso, último dia e prazo do pagamento —
     aparecem na hora, pela mesma conta do módulo e da Edge Function (assets/js/rescisao-datas.js).
     Só fala com o sistema pela Edge Function rescisao-link (formulário, envio e anexos — 28/10/2026: atestados, cartão
     ponto…, que vão pro Drive em SETOR DP E RH > RESCISÕES > EMPRESA > FUNCIONÁRIO, como os das admissões). Os textos são
     editados no módulo; ?previa=1 mostra os textos em edição, guardados pelo módulo no navegador. -->
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background:#EEF2F6; color:#1a2330; padding:0 0 60px; }
  .topo { background:linear-gradient(135deg, #3A5878, #5B82A6); color:#fff; padding:22px 20px 24px; text-align:center; }
  .topo img { width:46px; height:46px; object-fit:contain; background:#fff; border-radius:12px; padding:5px; display:block; margin:0 auto 8px; }
  .topo h1 { font-size:18px; font-weight:700; letter-spacing:.02em; }
  .topo p { font-size:12px; opacity:.85; margin-top:3px; }
  .wrap { max-width:600px; margin:-14px auto 0; padding:0 14px; }
  .card { background:#fff; border-radius:14px; box-shadow:0 4px 18px rgba(26,35,48,.08); padding:20px 18px; margin-bottom:14px; }
  .previa { background:#FFF7E0; border:1.5px dashed #D9A520; color:#6B4E00; font-size:13px; line-height:1.5; }
  .cab h2 { font-size:17px; color:#3A5878; line-height:1.35; }
  .cab .intro { font-size:13.5px; color:#4a5565; line-height:1.55; margin-top:10px; white-space:pre-line; }
  h3.bloco { font-size:12.5px; color:#3A5878; text-transform:uppercase; letter-spacing:.06em; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid #E3EAF1; }
  .campo { margin-bottom:16px; }
  .campo:last-child { margin-bottom:0; }
  .campo > label, .campo > .lbl { display:block; font-size:13.5px; color:#33404f; font-weight:600; margin-bottom:6px; }
  .campo small.ajuda { display:block; font-weight:400; color:#8a94a3; font-size:12px; margin-top:2px; }
  .campo input[type=text], .campo input[type=date], .campo textarea { width:100%; font:inherit; font-size:15px; padding:11px 12px; border:1.5px solid #D5DEE7; border-radius:10px; background:#FBFCFE; color:#1a2330; }
  .campo textarea { min-height:78px; resize:vertical; }
  .campo input:focus, .campo textarea:focus { outline:none; border-color:#5B82A6; background:#fff; }
  .ops { display:flex; flex-direction:column; gap:6px; }
  .op { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1.5px solid #D5DEE7; border-radius:10px; background:#FBFCFE; cursor:pointer; font-size:14.5px; }
  .op input { margin-top:3px; width:18px; height:18px; accent-color:#3A5878; flex:none; }
  .op small { display:block; color:#7a8595; font-size:12px; margin-top:2px; }
  .op:has(input:checked) { border-color:#5B82A6; background:#EEF4FA; }
  .obr::after { content:' *'; color:#C0564F; }
  .falta input[type=text], .falta input[type=date], .falta textarea, .falta .op { border-color:#C0564F; }
  .falta-msg { display:none; color:#C0564F; font-size:12px; margin-top:5px; }
  .falta .falta-msg { display:block; }
  .ramo { border-left:3px solid #CFDDEA; padding-left:12px; margin:4px 0 16px; }
  .datas { background:#F4F8FC; border:1.5px solid #CFDDEA; border-radius:12px; padding:14px 14px 10px; }
  .datas h4 { font-size:12px; color:#3A5878; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .datas .lin { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:8px 0; border-bottom:1px solid #E3EAF1; font-size:14px; color:#33404f; }
  .datas .lin b { color:#1a2330; text-align:right; }
  .datas .lin b small { display:block; font-weight:400; color:#7a8595; font-size:12px; }
  .datas .lin.dest { font-size:15px; font-weight:600; }
  .datas .lin.dest b { color:#2E7D5B; font-size:16px; }
  .datas ul { margin:10px 0 2px 18px; font-size:12.5px; color:#5c6878; line-height:1.5; }
  .datas li { margin-bottom:3px; }
  .datas .passou { color:#C0564F; font-weight:600; font-size:13px; margin-top:8px; }
  .botao { width:100%; font:inherit; font-size:16px; font-weight:700; padding:14px; border:none; border-radius:12px; background:#3A5878; color:#fff; cursor:pointer; }
  .botao.sec { background:#fff; color:#3A5878; border:1.5px solid #3A5878; margin-top:16px; }
  .botao:active { transform:scale(.99); }
  .botao[disabled] { opacity:.6; }
  .erro { color:#C0564F; font-size:13px; margin-top:10px; min-height:18px; text-align:center; }
  .aviso { text-align:center; padding:30px 20px; }
  .aviso .ic { font-size:42px; }
  .aviso h2 { font-size:18px; color:#3A5878; margin:10px 0 8px; }
  .aviso.ok h2 { color:#2E7D5B; }
  .aviso p { font-size:14px; color:#4a5565; line-height:1.6; white-space:pre-line; }
  .rodape { text-align:center; font-size:11.5px; color:#8a94a3; margin-top:18px; line-height:1.6; white-space:pre-line; }
  /* os anexos: o mesmo quadro das admissões (admissao.html), com o campo do arquivo alcançável pelo Tab */
  .anexo-ajuda { font-size:12px; color:#8a94a3; line-height:1.5; margin-bottom:10px; }
  .anexo { padding:12px; border:1.5px dashed #C9D5E2; border-radius:10px; background:#F7FAFC; }
  .anexo-btn { position:relative; display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:10px; background:#fff; border:1.5px solid #5B82A6; color:#3A5878; font-weight:700; font-size:14.5px; cursor:pointer; }
  .anexo-btn input { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }
  .anexo-btn:focus-within { outline:2px solid #5B82A6; outline-offset:2px; }
  .anexo-lista { margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .anexo-lista:empty { display:none; }
  .anexo-item { display:flex; gap:8px; align-items:center; font-size:13px; color:#33404f; background:#fff; border:1px solid #E3EAF1; border-radius:8px; padding:6px 8px; }
  .anexo-item span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .anexo-item small { color:#8a94a3; white-space:nowrap; }
  .anexo-item button { background:none; border:none; color:#C0564F; font-size:16px; cursor:pointer; padding:0 4px; }
  .anexo-email { font-size:12.5px; color:#5c6878; margin-top:8px; line-height:1.5; }
  .anexo-erro { color:#C0564F; font-size:12px; margin-top:6px; }
  .anexo-erro:empty { display:none; }
  .progresso { font-size:13px; color:#3A5878; margin-top:12px; text-align:center; }
  .progresso:empty { display:none; }
  .barra { height:6px; background:#E3EAF1; border-radius:99px; overflow:hidden; margin-top:6px; }
  .barra div { height:100%; background:#3A5878; width:0; transition:width .2s; }
  @media (prefers-reduced-motion: reduce) { .barra div { transition:none; } }
</style>
</head>
<body>
  <div class="topo">
    <img src="assets/logo-mr.png" alt="">
    <h1>Macedo &amp; Reis Contabilidade</h1>
    <p>Departamento Pessoal · Três Coroas – RS</p>
  </div>
  <div class="wrap">
    <div id="app"><div class="card"><p style="color:#8a94a3;font-size:13.5px;">Carregando o formulário…</p></div></div>
    <div class="rodape" id="rodape"></div>
  </div>

<script type="module">
  import { supabase } from './assets/js/supabase.js';
  import { PERGUNTAS, calcularRescisao, resumoDatas, fmtData, diaSemana, pedeDescontoExperiencia } from './assets/js/rescisao-datas.js';

  const RODAPE_PADRAO = 'Macedo e Reis Contabilidade Ltda · Rua Luiz Volkart, 35, 1º andar – Centro – Três Coroas/RS · CEP 95660-000 · (51) 3546-1385 · rh@macedoereis.com.br';
  const PRIVACIDADE = 'As informações vão direto para o Departamento Pessoal da Macedo & Reis e são usadas só para a rescisão do(a) funcionário(a).';
  const EMAIL_PADRAO = 'rh@macedoereis.com.br';
  const FUNCAO = 'rescisao-link';
  const PARTE = 2 * 1024 * 1024;                       // anexos sobem em partes de 2 MB (múltiplo de 256 KB, exigência do Drive)
  const MAX_ARQ = 25 * 1024 * 1024, MAX_QTD = 20, MAX_TOTAL = 100 * 1024 * 1024;
  const PREVIA = new URLSearchParams(location.search).get('previa') === '1';
  const app = document.getElementById('app');
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const hoje = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' });
  const tam = n => n >= 1048576 ? (n / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  let modelo = null, anexos = [], subindo = false;
  const email = () => (modelo && modelo.email) || EMAIL_PADRAO;
  const chamar = (body, headers) => supabase.functions.invoke(FUNCAO, headers ? { body, headers } : { body });
  // fechar a página no meio do envio dos arquivos: o navegador pergunta antes
  window.addEventListener('beforeunload', e => { if (subindo) { e.preventDefault(); e.returnValue = ''; } });

  function aviso(ic, titulo, texto, classe) {
    app.innerHTML = `<div class="card aviso ${classe || ''}"><div class="ic">${ic}</div><h2>${esc(titulo)}</h2><p>${esc(texto)}</p></div>`;
  }

  // ---------- campos ----------
  const ajudaDe = p => (p.ajuda ? `<small class="ajuda">${esc(p.ajuda)}</small>` : '');
  const texto = (id, rotulo, valor = '', obrig = true, ajuda = '') =>
    `<div class="campo" data-id="${id}"><label for="id_${id}"><span class="${obrig ? 'obr' : ''}">${esc(rotulo)}</span>${ajuda ? `<small class="ajuda">${esc(ajuda)}</small>` : ''}</label>`
    + `<input type="text" id="id_${id}" value="${esc(valor)}"><div class="falta-msg">Preencha este campo.</div></div>`;
  const data = (id, p) =>
    `<div class="campo" data-id="${id}"><label for="id_${id}"><span class="obr">${esc(p.rotulo)}</span>${ajudaDe(p)}</label>`
    + `<input type="date" id="id_${id}"><div class="falta-msg">Informe a data.</div></div>`;
  const escolha = (id, p) =>
    `<div class="campo" data-id="${id}"><div class="lbl"><span class="obr">${esc(p.rotulo)}</span>${ajudaDe(p)}</div><div class="ops">`
    + p.opcoes.map(([v, t, aj]) => `<label class="op"><input type="radio" name="${id}" value="${esc(v)}"><span>${esc(t)}${aj ? `<small>${esc(aj)}</small>` : ''}</span></label>`).join('')
    + '</div><div class="falta-msg">Escolha uma opção.</div></div>';

  // ---------- anexos (atestados, cartão ponto…): sobem pro Drive depois que a rescisão é gravada ----------
  function pintarAnexos() {
    const el = $('anxLista');
    if (!el) return;
    el.innerHTML = anexos.map((f, n) => `<div class="anexo-item"><span>📄 ${esc(f.name)}</span><small>${tam(f.size)}</small>`
      + `<button type="button" data-tira="${n}" title="Tirar" aria-label="Tirar ${esc(f.name)}">✕</button></div>`).join('');
    el.querySelectorAll('[data-tira]').forEach(b => b.addEventListener('click', () => {
      anexos.splice(Number(b.dataset.tira), 1);
      $('anxErro').textContent = '';
      pintarAnexos();
    }));
  }
  function adicionarAnexos(files) {
    const recusados = [];
    for (const f of files) {
      if (anexos.some(a => a.name === f.name && a.size === f.size && a.lastModified === f.lastModified)) { recusados.push(`${f.name} já está na lista`); continue; }
      if (!f.size) { recusados.push(`${f.name} está vazio`); continue; }
      if (f.size > MAX_ARQ) { recusados.push(`${f.name} passa de 25 MB`); continue; }
      if (anexos.length >= MAX_QTD) { recusados.push(`limite de ${MAX_QTD} arquivos`); break; }
      if (anexos.reduce((s, a) => s + a.size, 0) + f.size > MAX_TOTAL) { recusados.push(`${f.name} passa do total de 100 MB`); continue; }
      anexos.push(f);
    }
    $('anxErro').textContent = recusados.length ? 'Não anexado: ' + recusados.join('; ') + '. Se precisar, mande por e-mail para ' + email() + '.' : '';
    pintarAnexos();
  }

  function desenhar(ident = {}) {
    anexos = [];
    let html = '';
    if (PREVIA) html += '<div class="card previa"><b>Prévia</b> — é assim que a empresa vê o formulário. Nada do que for preenchido aqui é enviado.</div>';
    html += '<div class="card cab">'
      + `<h2>${esc(modelo.titulo || 'Rescisão de funcionário(a)')}</h2>`
      + (modelo.introducao ? `<div class="intro">${esc(modelo.introducao)}</div>` : '')
      + '</div>';
    html += '<div class="card"><h3 class="bloco">Empresa</h3>'
      + texto('empresa', 'Empresa (razão social)', ident.empresa) + texto('contato', 'Seu nome', ident.contato) + '</div>';
    html += '<div class="card"><h3 class="bloco">Rescisão</h3>'
      + texto('funcionario', PERGUNTAS.funcionario.rotulo)
      + escolha('tipo', PERGUNTAS.tipo)
      + '<div class="ramo" id="blPedido" hidden>' + escolha('avisoPedido', PERGUNTAS.avisoPedido)
      +   '<div id="blCumpre" hidden>' + data('dataPedido', PERGUNTAS.dataPedido) + '</div>'
      +   '<div id="blImediato" hidden>' + escolha('desconto', PERGUNTAS.desconto) + data('ultimoDia', PERGUNTAS.ultimoDia) + '</div>'
      + '</div>'
      + '<div class="ramo" id="blDispensa" hidden>' + data('dataComunicacao', PERGUNTAS.dataComunicacao) + escolha('avisoDispensa', PERGUNTAS.avisoDispensa) + '</div>'
      + '<div class="ramo" id="blExperiencia" hidden>' + escolha('iniciativa', PERGUNTAS.iniciativa) + data('admissao', PERGUNTAS.admissao)
      +   escolha('prazoExperiencia', PERGUNTAS.prazoExperiencia) + data('dataDesligamento', PERGUNTAS.dataDesligamento)
      +   '<div id="blDescExp" hidden>' + escolha('descontoExperiencia', PERGUNTAS.descontoExperiencia) + '</div></div>'
      + '<div class="datas" id="datas" hidden></div>'
      + '</div>';
    html += `<div class="card" id="blArquivos"><h3 class="bloco">${esc(PERGUNTAS.arquivos.rotulo)}</h3><div class="anexo-ajuda">${esc(PERGUNTAS.arquivos.ajuda)}</div>`
      + '<div class="anexo"><label class="anexo-btn">📎 Anexar arquivos<input type="file" multiple id="id_arquivos"></label>'
      + '<div class="anexo-lista" id="anxLista"></div><div class="anexo-erro" id="anxErro" role="alert"></div>'
      + `<div class="anexo-email">Anexe aqui (PDF, foto ou qualquer arquivo) ou envie para <b>${esc(email())}</b>.</div></div></div>`;
    html += `<div class="card"><h3 class="bloco">${esc(PERGUNTAS.obs.rotulo)}</h3><div class="campo" data-id="obs"><label for="id_obs"><small class="ajuda" style="margin:0">${esc(PERGUNTAS.obs.ajuda)}</small></label><textarea id="id_obs"></textarea></div></div>`;
    html += '<div class="card"><button class="botao" id="btnEnviar">Enviar informações</button><div class="erro" id="msgErro"></div>'
      + '<div class="progresso" id="progresso" aria-live="polite"></div><div class="barra" id="barra" hidden><div></div></div></div>';
    app.innerHTML = html;
    app.querySelectorAll('.campo').forEach(c => { c.addEventListener('input', () => c.classList.remove('falta')); c.addEventListener('change', () => c.classList.remove('falta')); });
    $('id_arquivos').addEventListener('change', e => { adicionarAnexos([...e.target.files]); e.target.value = ''; });
    $('btnEnviar').addEventListener('click', enviar);
  }
  // as respostas mostram/escondem os "se" e refazem as datas (um ouvinte só, no #app, que sobrevive aos redesenhos)
  app.addEventListener('change', () => atualizar());
  app.addEventListener('input', e => { if (e.target.type === 'date') atualizar(); });

  const marcado = nome => (app.querySelector(`input[name="${nome}"]:checked`) || {}).value || '';
  const valor = id => (($('id_' + id) || {}).value || '').trim();

  // o caso como está respondido agora: { tipo, aviso, data, desconta } — só os campos que estão à vista
  function lerCaso() {
    const tipo = marcado('tipo');
    if (tipo === 'pedido') {
      const aviso = marcado('avisoPedido');
      if (aviso === 'trabalhado') return { tipo, aviso, data: valor('dataPedido'), campoData: 'dataPedido' };
      if (aviso === 'imediato') { const d = marcado('desconto'); return { tipo, aviso, data: valor('ultimoDia'), campoData: 'ultimoDia', desconta: d ? d === 'sim' : null }; }
      return { tipo };
    }
    if (tipo === 'dispensa') return { tipo, aviso: marcado('avisoDispensa'), data: valor('dataComunicacao'), campoData: 'dataComunicacao' };
    if (tipo === 'experiencia') {
      const d = marcado('descontoExperiencia');
      return { tipo, aviso: null, data: valor('dataDesligamento'), campoData: 'dataDesligamento', admissao: valor('admissao'), prazo: marcado('prazoExperiencia'),
               iniciativa: marcado('iniciativa'), desconta: d ? d === 'sim' : null };
    }
    return {};
  }

  function atualizar() {
    if (!$('blPedido')) return;   // tela de "recebido"
    const c = lerCaso();
    $('blPedido').hidden = c.tipo !== 'pedido';
    $('blDispensa').hidden = c.tipo !== 'dispensa';
    $('blExperiencia').hidden = c.tipo !== 'experiencia';
    $('blCumpre').hidden = !(c.tipo === 'pedido' && c.aviso === 'trabalhado');
    $('blImediato').hidden = !(c.tipo === 'pedido' && c.aviso === 'imediato');
    // datas só depois de dizer quem encerra (as notas da experiência dependem disso)
    const calc = c.tipo === 'experiencia' && !c.iniciativa ? null : calcularRescisao(c);
    $('blDescExp').hidden = !pedeDescontoExperiencia(calc);
    pintarDatas(calc);
  }

  function pintarDatas(calc) {
    const el = $('datas');
    const r = resumoDatas(calc);
    if (!r) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = '<h4>📅 Pelas informações acima</h4>'
      + (r.alerta ? `<div class="passou" style="margin:0 0 6px">⚠ ${esc(r.alerta)}</div>` : '')
      + r.linhas.map(l => `<div class="lin${l.destaque ? ' dest' : ''}"><span>${esc(l.rotulo)}</span><b>${fmtData(l.data)}<small>${diaSemana(l.data)}</small></b></div>`).join('')
      + (calc.limite < hoje() ? '<div class="passou">⚠ Esse prazo já passou — confira a data informada ou fale com o escritório o quanto antes.</div>' : '')
      + '<ul>' + r.notas.map(n => `<li>${esc(n)}</li>`).join('') + '</ul>';
  }

  function coletar() {
    const faltam = [];
    const campo = id => app.querySelector(`.campo[data-id="${id}"]`);
    const ident = { empresa: valor('empresa'), contato: valor('contato') };
    ['empresa', 'contato', 'funcionario'].forEach(id => { if (!valor(id)) faltam.push(campo(id)); });
    const c = lerCaso();
    const msgData = $('id_dataDesligamento') && campo('dataDesligamento').querySelector('.falta-msg');
    if (msgData) msgData.textContent = 'Informe a data.';
    if (!c.tipo) faltam.push(campo('tipo'));
    else if (c.tipo === 'experiencia') {
      // contrato de experiência: quem encerra, admissão, prazo e o último dia (que não pode ser antes da admissão)
      if (!c.iniciativa) faltam.push(campo('iniciativa'));
      if (!c.admissao) faltam.push(campo('admissao'));
      if (!c.prazo) faltam.push(campo('prazoExperiencia'));
      if (!c.data) faltam.push(campo('dataDesligamento'));
      else if (c.admissao && c.data < c.admissao) { msgData.textContent = 'A data de encerramento é antes da admissão.'; faltam.push(campo('dataDesligamento')); }
      if (c.iniciativa && pedeDescontoExperiencia(calcularRescisao(c)) && c.desconta == null) faltam.push(campo('descontoExperiencia'));
    } else if (!c.aviso) faltam.push(campo(c.tipo === 'pedido' ? 'avisoPedido' : 'avisoDispensa'));
    if (c.tipo === 'pedido' && c.aviso === 'imediato' && c.desconta == null) faltam.push(campo('desconto'));
    if (c.tipo !== 'experiencia' && c.campoData && !calcularRescisao(c)) faltam.push(campo(c.campoData));
    return { ident, caso: c, funcionario: valor('funcionario'), obs: valor('obs'), faltam: [...new Set(faltam.filter(Boolean))] };
  }

  function progresso(texto, fracao) {
    $('progresso').textContent = texto || '';
    const barra = $('barra');
    barra.hidden = fracao == null;
    if (fracao != null) barra.firstElementChild.style.width = Math.round(Math.min(1, fracao) * 100) + '%';
  }

  // um anexo: abre o envio no Drive e manda as partes em sequência (tenta de novo a parte que falhar na rede)
  async function subir(id, chave, i, f, feito, total, qtd) {
    const r1 = await chamar({ acao: 'arquivo', id, chave, i, nome: f.name, tipo: f.type || 'application/octet-stream', tamanho: f.size });
    if (r1.error || !r1.data || !r1.data.ok) return false;
    for (let ini = 0; ini < f.size; ini += PARTE) {
      const pedaco = f.slice(ini, Math.min(f.size, ini + PARTE));
      let r = null;
      for (let tentativa = 0; tentativa < 3; tentativa++) {
        r = await chamar(pedaco, { 'x-acao': 'parte', 'x-id': id, 'x-chave': chave, 'x-i': String(i), 'x-inicio': String(ini), 'x-total': String(f.size) });
        if (!r.error) break;
      }
      if (r.error || !r.data || !r.data.ok) return false;
      progresso(`Enviando os arquivos: ${i + 1} de ${qtd} (${f.name})`, (feito + Math.min(f.size, ini + PARTE)) / total);
    }
    return true;
  }

  async function enviar() {
    const erro = $('msgErro');
    const btn = $('btnEnviar');
    app.querySelectorAll('.campo.falta').forEach(c => c.classList.remove('falta'));
    const { ident, caso, funcionario, obs, faltam } = coletar();
    if (faltam.length) {
      faltam.forEach(c => c.classList.add('falta'));
      erro.textContent = faltam.length === 1 ? 'Falta 1 resposta (marcada em vermelho).' : `Faltam ${faltam.length} respostas (marcadas em vermelho).`;
      faltam[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (PREVIA) { erro.textContent = 'Prévia: tudo preenchido. Na prévia nada é enviado.'; return; }
    erro.textContent = '';
    const lista = anexos.slice();
    btn.disabled = true; btn.textContent = 'Enviando…';
    progresso(lista.length ? 'Enviando as informações…' : '', null);
    const corpo = { acao: 'enviar', empresa: ident.empresa, contato: ident.contato, funcionario, tipo: caso.tipo, data: caso.data, obs };
    if (caso.tipo === 'experiencia') {
      corpo.iniciativa = caso.iniciativa; corpo.admissao = caso.admissao; corpo.prazo = caso.prazo;
      if (pedeDescontoExperiencia(calcularRescisao(caso))) corpo.desconta = caso.desconta;
    }
    else corpo.aviso = caso.aviso;
    if (caso.tipo === 'pedido' && caso.aviso === 'imediato') corpo.desconta = caso.desconta;
    // os anexos: aqui só a lista (nome, tamanho, tipo); a função cria a pasta no Drive e devolve a chave pra subir cada um
    if (lista.length) corpo.arquivos = lista.map(f => ({ nome: f.name, tamanho: f.size, tipo: f.type || 'application/octet-stream' }));
    const { data: r, error } = await chamar(corpo);
    if (error || !r || r.error) {
      btn.disabled = false; btn.textContent = 'Enviar informações'; progresso('', null);
      erro.textContent = (r && r.error) ? r.error
        : 'Não foi possível enviar agora (' + ((error && error.message) || 'erro de conexão') + '). Tente de novo; se continuar, mande as informações para ' + email() + '.';
      return;
    }
    const falhas = [];
    if (lista.length) {
      if (!r.chave) falhas.push(...lista.map(f => f.name));
      else {
        subindo = true;
        try {
          const total = lista.reduce((s, f) => s + f.size, 0);
          let feito = 0;
          for (const [i, f] of lista.entries()) {
            progresso(`Enviando os arquivos: ${i + 1} de ${lista.length} (${f.name})`, feito / total);
            const foi = await subir(r.id, r.chave, i, f, feito, total, lista.length).catch(() => false);
            if (!foi) falhas.push(f.name);
            feito += f.size;
          }
          await chamar({ acao: 'concluir', id: r.id, chave: r.chave }).catch(() => null);
        } finally { subindo = false; }
      }
    }
    let msg = modelo.final || 'Obrigado! O Departamento Pessoal do escritório vai conferir as informações e preparar a rescisão.';
    const lim = r.datas && r.datas.limite;
    if (lim) msg += `\n\nPagamento da rescisão até ${fmtData(lim)} (${diaSemana(lim)}).`;
    const foram = lista.length - falhas.length;
    if (foram) msg += `\n\n${foram === 1 ? '1 arquivo enviado' : foram + ' arquivos enviados'} para o escritório.`;
    if (falhas.length) msg += `\n\nNão conseguimos enviar: ${falhas.join(', ')}. Mande ${falhas.length === 1 ? 'esse arquivo' : 'esses arquivos'} para ${r.email || email()}.`;
    aviso(falhas.length ? '⚠️' : '✅', 'Informações recebidas!', msg, falhas.length ? '' : 'ok');
    const outro = document.createElement('button');
    outro.className = 'botao sec'; outro.id = 'btnOutro'; outro.textContent = 'Enviar outra rescisão';
    outro.addEventListener('click', () => { desenhar(ident); window.scrollTo({ top: 0 }); });
    app.querySelector('.aviso').appendChild(outro);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function iniciar() {
    if (PREVIA) {
      let dados = null;
      try { dados = JSON.parse(localStorage.getItem('mr_rescisao_previa') || 'null'); } catch (e) { dados = null; }
      modelo = dados && dados.modelo;
    } else {
      const { data: r, error } = await chamar({ acao: 'formulario' });
      if (error || !r) { aviso('⚠️', 'Não conseguimos abrir o formulário', 'Tente de novo em instantes. Se continuar, fale com o escritório.'); rodape(); return; }
      modelo = r.error ? null : r;
    }
    rodape();
    if (!modelo) {
      aviso('⚠️', PREVIA ? 'Prévia indisponível' : 'Formulário indisponível', PREVIA ? 'Abra a prévia pelo módulo Rescisões, no botão "Ver como a empresa vê".' : 'Fale com o escritório, por favor.');
      return;
    }
    desenhar();
  }
  function rodape() {
    $('rodape').textContent = ((modelo && modelo.rodape) || RODAPE_PADRAO) + '\n' + PRIVACIDADE;
  }

  iniciar();
</script>
